endpoint:
  name: aws-s3
  url: https://s3.us-east-1.amazonaws.com
  region: us-east-1
  access_key: REPLACE_ME
  secret_key: REPLACE_ME
  use_path_style: false

bucket: my-bucket

methods: [put, post, multipart, presigned]

method_options:
  multipart:
    part_size: 5242880
  post:
    success_action_status: 201
    extra_fields: {}
  presigned:
    expires_in: 3600s
    method: put

sizes:
  - [1, 1024, 50]
  - [1024, 1048576, 30]
  - [1048576, 10485760, 20]

content:
  type: random
  seed: 0

runner:
  total: 1000
  concurrency: 32
  key_prefix: "test/"
  verify: true
  cleanup: false
  timeout: 300s
  out_prefix: out
